<!-- ==================================================================== -->
<!-- ไฟล์: index.html (แสดงผล 4 หัวข้อ + ระบบป้องกันการแคปหน้าจอคอมและมือถือ) -->
<!-- ==================================================================== -->
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>คู่มือการบูชาเฉพาะบุคคล - 1SBUCHA</title>
  
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    /* 1. ป้องกันการคลุมดำ คัดลอกข้อความ ลากรูป และคลิกขวา */
    * {
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
    }

    body {
      font-family: 'Sarabun', sans-serif;
      background-color: #0f1115;
      color: #e6e6e6;
      margin: 0;
      padding: 20px;
      position: relative;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      max-width: 500px;
      margin: auto;
      position: relative;
      z-index: 2;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h2 {
      color: #d4af37;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .card {
      background: #1a1d24;
      border: 1px solid #2a2e39;
      border-radius: 14px;
      padding: 20px 18px;
      margin-bottom: 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      position: relative;
      overflow: hidden;
    }

    .card h3 {
      color: #f3c644;
      margin-top: 0;
      margin-bottom: 14px;
      border-bottom: 1px solid #2f3442;
      padding-bottom: 10px;
      font-size: 18px;
    }

    /* หัวข้อและเนื้อหา 4 ส่วนตามที่กำหนด */
    .section-title {
      font-weight: 600;
      color: #ffffff;
      margin-top: 14px;
      margin-bottom: 4px;
      font-size: 14.5px;
      display: flex;
      align-items: center;
    }

    .section-content {
      font-size: 13.5px;
      line-height: 1.65;
      color: #cfcfcf;
      white-space: pre-line;
      padding-left: 2px;
    }

    #status-box {
      text-align: center;
      margin-top: 50px;
      font-size: 15px;
      color: #d4af37;
    }

    .register-box {
      background: #1a1d24;
      border: 1px solid #d4af37;
      border-radius: 14px;
      padding: 24px 20px;
      text-align: center;
      margin-top: 30px;
      box-shadow: 0 4px 16px rgba(212,175,55,0.15);
    }

    .register-box h3 {
      color: #f3c644;
      margin-top: 0;
      margin-bottom: 10px;
    }

    .register-box p {
      color: #b0b0b0;
      font-size: 13.5px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .input-phone {
      width: 85%;
      padding: 12px 14px;
      font-size: 16px;
      text-align: center;
      border-radius: 8px;
      border: 1px solid #444;
      background: #0f1115;
      color: #fff;
      letter-spacing: 2px;
      margin-bottom: 15px;
      outline: none;
    }

    .btn-submit {
      width: 90%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      background: linear-gradient(135deg, #d4af37, #aa820a);
      color: #000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-submit:disabled {
      background: #555;
      color: #888;
      cursor: not-allowed;
    }

    .error-text {
      color: #ff6b6b;
      font-size: 13px;
      margin-top: 12px;
    }

    /* ============================================================ */
    /* 2. ระบบป้องกันการแคปหน้าจอ (Anti-Screenshot Curtain) */
    /* ============================================================ */
    #blackout-curtain {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000 !important;
      z-index: 9999999;
      pointer-events: all;
    }

    /* 3. ลายน้ำระบุตัวตนจางๆ ซ้อนบนการ์ด ป้องกันการเอามือถือเครื่องอื่นมาถ่ายจอ */
    .watermark-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.05;
      font-size: 12px;
      line-height: 28px;
      color: #ffffff;
      overflow: hidden;
      word-break: break-all;
    }

    /* 4. ป้องกันการสั่งพิมพ์ หรือบันทึกเป็น PDF ในคอมพิวเตอร์ */
    @media print {
      body {
        background-color: #000000 !important;
        color: #000000 !important;
      }
      .container {
        display: none !important;
      }
    }
  </style>
</head>
<body oncontextmenu="return false;">
  <!-- ม่านดำสนิทที่จะบังหน้าจอทันทีเมื่อเกิดเหตุการณ์แคปภาพ -->
  <div id="blackout-curtain"></div>

  <div class="container">
    <div id="status-box">กำลังเริ่มต้นระบบ...</div>

    <!-- ส่วนกรอกเบอร์โทรยืนยันสิทธิ์ -->
    <div id="register-section" style="display: none;">
      <div class="register-box">
        <div style="font-size: 40px; margin-bottom: 8px;">📱</div>
        <h3>ยืนยันสิทธิ์การเข้าถึงคู่มือ</h3>
        <p>กรุณากรอก <b>เบอร์โทรศัพท์</b> ที่ใช้ในการสั่งซื้อ<br>เพื่อเปิดใช้งานคู่มือบูชาประจำตัวของคุณ</p>
        
        <input type="tel" id="input-phone" class="input-phone" placeholder="เช่น 0839028526" maxlength="10">
        <br>
        <button id="btn-submit" class="btn-submit" onclick="submitPhone()">ยืนยันเบอร์โทรศัพท์</button>
        <div id="register-error" class="error-text"></div>
      </div>
    </div>
    
    <!-- ส่วนแสดงคู่มือเมื่อมีสิทธิ์แล้ว -->
    <div id="content" style="display: none;">
      <div class="header">
        <h2>คู่มือการบูชาเฉพาะบุคคล</h2>
        <div id="user-greeting" style="color: #aaa; font-size: 14px;"></div>
      </div>
      <div id="guide-list"></div>
    </div>
  </div>

  <script>
    // ==================================================================
    // ⚙️ ตัวแปรตั้งค่าระบบ
    // ==================================================================
    const MY_LIFF_ID = "2011794620-dxoRmHEn"; 
    
    // ⚠️ นำ Web App URL ของคุณ (ที่ลงท้ายด้วย /exec) มาใส่ตรงนี้
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycb.../exec"; 

    let globalUserId = "";
    const curtain = document.getElementById('blackout-curtain');

    // ==================================================================
    // 🛡️ ระบบป้องกันการแคปหน้าจอ (ทั้งคอมพิวเตอร์และมือถือ)
    // ==================================================================
    function activateBlackout() {
      curtain.style.display = 'block';
    }

    function deactivateBlackout() {
      // หน่วงเวลาเล็กน้อยก่อนปลดม่านดำเพื่อความปลอดภัย
      setTimeout(() => {
        curtain.style.display = 'none';
      }, 300);
    }

    // A. ป้องกันบนมือถือและคอม: เมื่อสลับหน้าต่าง, พับหน้าจอ หรือเปิดแถบเมนูแคปภาพ
    window.addEventListener('blur', activateBlackout);
    window.addEventListener('focus', deactivateBlackout);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        activateBlackout();
      } else {
        deactivateBlackout();
      }
    });

    // B. ป้องกันบนคอมพิวเตอร์: ดักจับปุ่ม PrintScreen, Snipping Tool, Mac Screenshot (Cmd+Shift+3/4/5)
    window.addEventListener('keyup', (e) => {
      if (e.key === 'PrintScreen' || e.keyCode === 44) {
        activateBlackout();
        // ล้างข้อมูลในคลิปบอร์ดทันที
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText('');
        }
        setTimeout(deactivateBlackout, 1500);
      }
    });

    window.addEventListener('keydown', (e) => {
      // ดักจับ Windows: Win+Shift+S หรือ Mac: Cmd+Shift+3, Cmd+Shift+4, Cmd+Shift+5
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === '3' || e.key === '4' || e.key === '5' || e.key === 's' || e.key === 'S')) {
        activateBlackout();
        setTimeout(deactivateBlackout, 2000);
      }
    });

    // C. ดักจับเมื่อเมาส์หลุดออกจากขอบหน้าต่างเบราว์เซอร์ (มักเกิดตอนเปิดโปรแกรมแคปจอในคอม)
    document.addEventListener('mouseleave', activateBlackout);
    document.addEventListener('mouseenter', deactivateBlackout);

    /**
     * ฟังก์ชันส่งคำขอข้อมูลผ่าน JSONP (ข้ามข้อจำกัด Safari)
     */
    function fetchJSONP(url) {
      return new Promise((resolve, reject) => {
        const callbackName = 'cb_' + Math.round(100000 * Math.random());
        const timeoutId = setTimeout(() => {
          cleanup();
          reject(new Error('Timeout: การเชื่อมต่อใช้เวลานานเกินไป'));
        }, 15000);

        function cleanup() {
          clearTimeout(timeoutId);
          delete window[callbackName];
          if (script && script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }

        window[callbackName] = function(data) {
          cleanup();
          resolve(data);
        };

        const script = document.createElement('script');
        const separator = url.indexOf('?') >= 0 ? '&' : '?';
        script.src = `${url}${separator}callback=${callbackName}&_t=${Date.now()}`;
        
        script.onerror = function() {
          cleanup();
          reject(new Error('ไม่สามารถเชื่อมต่อกับ Google Apps Script ได้'));
        };

        document.body.appendChild(script);
      });
    }

    /**
     * ฟังก์ชันหลัก
     */
    async function main() {
      const statusBox = document.getElementById('status-box');
      try {
        statusBox.innerText = "กำลังเชื่อมต่อกับ LINE...";
        await liff.init({ liffId: MY_LIFF_ID });

        if (!liff.isLoggedIn()) {
          statusBox.innerText = "กำลังนำเข้าสู่ระบบ LINE...";
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        globalUserId = profile.userId;

        statusBox.innerText = "กำลังตรวจสอบสิทธิ์...";
        
        const res = await fetchJSONP(`${GAS_API_URL}?action=getGuides&userId=${encodeURIComponent(globalUserId)}`);
        statusBox.style.display = 'none';

        if (res && res.status === 'success') {
          renderGuides(res);
        } else {
          document.getElementById('register-section').style.display = 'block';
        }

      } catch (err) {
        statusBox.style.display = 'none';
        document.getElementById('register-section').style.display = 'block';
        document.getElementById('register-error').innerText = 'ระบบกำลังเปิดการยืนยันด้วยเบอร์โทรศัพท์สำรอง';
      }
    }

    /**
     * ฟังก์ชันส่งเบอร์โทรไปผูกกับคอลัมน์ B
     */
    async function submitPhone() {
      const phoneInput = document.getElementById('input-phone');
      const errorDiv = document.getElementById('register-error');
      const submitBtn = document.getElementById('btn-submit');
      const phoneVal = phoneInput.value.trim();

      errorDiv.innerText = '';

      if (!phoneVal || phoneVal.length < 9) {
        errorDiv.innerText = 'กรุณากรอกเบอร์โทรศัพท์ให้ถูกต้อง';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'กำลังตรวจสอบข้อมูล...';

      try {
        const res = await fetchJSONP(`${GAS_API_URL}?action=registerPhone&phone=${encodeURIComponent(phoneVal)}&userId=${encodeURIComponent(globalUserId)}`);
        
        submitBtn.disabled = false;
        submitBtn.innerText = 'ยืนยันเบอร์โทรศัพท์';

        if (res && res.status === 'success') {
          document.getElementById('register-section').style.display = 'none';
          renderGuides(res);
        } else {
          errorDiv.innerText = res.message || 'ไม่พบข้อมูลคำสั่งซื้อที่ตรงกับเบอร์นี้';
        }
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerText = 'ยืนยันเบอร์โทรศัพท์';
        errorDiv.innerText = 'เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง';
      }
    }

    /**
     * ฟังก์ชันแสดงผลคู่มือ 4 ส่วน:
     * A: ชื่อเครื่องราง (${item.title})
     * B: คุณสมบัติเครื่องราง (${item.attributes})
     * C: วิธีใช้งานและการขอพร (${item.howToUse})
     * D: วิธีเก็บรักษาและข้อควรระวัง (${item.howToCare})
     */
    function renderGuides(res) {
      document.getElementById('user-greeting').innerText = `สำหรับ: คุณ${res.customerName}`;
      const container = document.getElementById('guide-list');
      container.innerHTML = '';

      // ข้อความลายน้ำป้องกันการถ่ายภาพ
      const watermarkText = `สิทธิ์เฉพาะคุณ ${res.customerName} (${res.customerPhone || ''}) ห้ามบันทึกภาพ `;
      const repeatedWatermark = watermarkText.repeat(30);

      res.guides.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <!-- ลายน้ำจางๆ ซ้อนด้านหลังการ์ด -->
          <div class="watermark-overlay">${repeatedWatermark}</div>
          
          <!-- A: ชื่อเครื่องราง -->
          <h3>✨ ${item.title}</h3>
          
          <!-- B: คุณสมบัติเครื่องราง -->
          <div class="section-title">🔮 คุณสมบัติเครื่องราง:</div>
          <div class="section-content">${item.attributes}</div>

          <!-- C: วิธีใช้งานและการขอพร -->
          <div class="section-title">📌 วิธีใช้งานและการขอพร:</div>
          <div class="section-content">${item.howToUse}</div>

          <!-- D: วิธีเก็บรักษาและข้อควรระวัง -->
          <div class="section-title">🛡️ วิธีเก็บรักษาและข้อควรระวัง:</div>
          <div class="section-content">${item.howToCare}</div>
        `;
        container.appendChild(card);
      });

      document.getElementById('content').style.display = 'block';
    }

    main();
  </script>
</body>
</html>
